services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nu_policy
      POSTGRES_USER: nu_policy
      POSTGRES_PASSWORD: ${NU_POSTGRES_PASSWORD:?Set NU_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nu_policy", "-d", "nu_policy"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
